<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>학생 정보 관리</title>
    <style>
      :root {
        --color-bg: #222;
        --color-text: #eee;
        --color-border: #444;
        --color-hover: #333;
        --color-btn-primary-bg: #eee;
        --color-btn-primary-text: #333;
        --color-btn-secondary-bg: #555;
        --color-btn-secondary-text: #eee;
        --color-modal-bg: #333;
        --color-input-bg: #444;
        --color-input-focus-bg: #555;
        --font-base: "Noto Sans KR", sans-serif;
        --spacing-0: 0;
        --spacing-0-5: 0.5rem;
        --spacing-1: 1rem;
        --spacing-1-5: 1.5rem;
        --spacing-2: 2rem;
        --border-radius-sm: 0.375rem;
        --border-radius-md: 0.5rem;
        --transition-fast: 0.15s;
        --transition-slow: 0.2s;
        --shadow-btn: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.24);
        --shadow-btn-hover: 0 3px 6px rgba(0, 0, 0, 0.16), 0 3px 6px rgba(0, 0, 0, 0.23);
      }
      * {
        box-sizing: border-box;
        margin: var(--spacing-0);
        padding: var(--spacing-0);
      }
      body {
        font-family: var(--font-base);
        background-color: var(--color-bg);
        color: var(--color-text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .bg-dark {
        background-color: var(--color-bg);
      }
      .text-light {
        color: var(--color-text);
      }
      .m-b-1 {
        margin-bottom: var(--spacing-1);
      }
      .p-1 {
        padding: var(--spacing-1);
      }
      .p-0-5 {
        padding: var(--spacing-0-5);
      }
      .border-right {
        border-right: 1px solid var(--color-border);
      }
      .border-left {
        border-left: 1px solid var(--color-border);
      }
      .grid {
        display: grid;
      }
      .grid-cols-3 {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .min-vh-100 {
        min-height: 100vh;
      }
      .text-xl {
        font-size: 1.25rem;
      }
      .font-semibold {
        font-weight: 600;
      }
      .cursor-pointer {
        cursor: pointer;
      }
      .rounded-sm {
        border-radius: var(--border-radius-sm);
      }
      .rounded-md {
        border-radius: var(--border-radius-md);
      }
      .transition-colors {
        transition: background-color var(--transition-fast) ease-in-out,
          color var(--transition-fast) ease-in-out;
      }
      .hover-bg {
        transition: background-color var(--transition-fast) ease-in-out;
      }
      .hover-bg:hover {
        background-color: var(--color-hover);
      }
      .flex {
        display: flex;
      }
      .justify-between {
        justify-content: space-between;
      }
      .gap-2 {
        gap: var(--spacing-1);
      }
      .fixed {
        position: fixed;
      }
      .center {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .hidden {
        display: none;
      }
      .modal-overlay {
        background-color: rgba(34, 34, 34, 0.8);
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity var(--transition-slow) ease-out,
          visibility var(--transition-slow) ease-out;
      }
      .modal-overlay.active {
        opacity: 1;
        visibility: visible;
      }
      .modal-content {
        background-color: var(--color-modal-bg);
        box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.6);
        border-radius: var(--border-radius-md);
        padding: var(--spacing-2);
        width: 90vw;
        max-width: 500px;
        opacity: 0;
        transform: translateY(-20px);
        transition: opacity var(--transition-slow) ease-out 0.1s,
          transform var(--transition-slow) ease-out 0.1s;
      }
      .modal-overlay.active .modal-content {
        opacity: 1;
        transform: translateY(0);
      }
      .input-field {
        background-color: var(--color-input-bg);
        border: none;
        color: var(--color-text);
        padding: var(--spacing-1);
        border-radius: var(--border-radius-sm);
        width: 100%;
        font-family: inherit;
        font-size: 1rem;
        transition: background-color 0.2s ease-in-out;
      }
      .input-field:focus {
        outline: none;
        background-color: var(--color-input-focus-bg);
        box-shadow: 0 0 0 2px rgba(100, 149, 237, 0.2);
      }
      .btn {
        padding: var(--spacing-1);
        border: none;
        border-radius: var(--border-radius-sm);
        cursor: pointer;
        font-family: inherit;
        font-weight: 500;
        transition: background-color var(--transition-fast) ease-in-out,
          color var(--transition-fast) ease-in-out, transform 0.1s ease-in-out;
        box-shadow: var(--shadow-btn);
      }
      .btn-primary {
        background-color: var(--color-btn-primary-bg);
        color: var(--color-btn-primary-text);
      }
      .btn-primary:hover {
        background-color: #f0f0f0;
        transform: scale(1.02);
        box-shadow: var(--shadow-btn-hover);
      }
      .btn-secondary {
        background-color: var(--color-btn-secondary-bg);
        color: var(--color-btn-secondary-text);
      }
      .btn-secondary:hover {
        background-color: #666;
        transform: scale(1.02);
        box-shadow: var(--shadow-btn-hover);
      }
      .list-item {
        padding: var(--spacing-1);
        border-radius: var(--border-radius-sm);
        transition: background-color var(--transition-fast) ease-in-out,
          color var(--transition-fast) ease-in-out;
      }
      .list-item:hover {
        background-color: var(--color-hover);
        cursor: pointer;
      }
      .modified-item {
        padding: var(--spacing-1);
        border-bottom: 1px solid var(--color-border);
      }
      .modified-item > strong {
        font-weight: 600;
      }
      .container {
        padding: var(--spacing-1);
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-dark text-light font-base">
    <div id="root" class="container">
      <div class="grid grid-cols-3 min-vh-100">
        <div class="container border-right">
          <h2 class="text-xl font-semibold m-b-1">학생 목록</h2>
          <div class="item-list"></div>
        </div>
        <div class="container">
          <h1 class="text-xl font-semibold m-b-1">학생 정보</h1>
          <div class="student-detail"></div>
        </div>
        <div class="container border-left">
          <h2 class="text-xl font-semibold m-b-1">수정된 정보</h2>
          <div class="modified-list"></div>
          <div class="json-button-container"></div>
        </div>
      </div>
      <div class="modal-overlay"></div>
    </div>
    <script type="module">
      "use strict";
      const SELECTORS = {
        foodInput: "food-input",
        addLike: "add-like",
        addHate: "add-hate",
        confirm: "confirm",
        delete: "delete",
        cancel: "cancel",
      };

      const ATOMS = {
        create: function (tag, attributes, children) {
          const element = document.createElement(tag);
          if (attributes !== null && typeof attributes === "object") {
            Object.keys(attributes).forEach(function (key) {
              element.setAttribute(key, attributes[key]);
            });
          }
          if (children !== null) {
            if (Array.isArray(children)) {
              children.forEach(function (child) {
                if (typeof child === "string") {
                  element.appendChild(document.createTextNode(child));
                } else {
                  element.appendChild(child);
                }
              });
            } else if (typeof children === "string") {
              element.appendChild(document.createTextNode(children));
            }
          }
          return element;
        },
        appendAll: function (parent, children) {
          children.forEach(function (child) {
            parent.appendChild(child);
          });
          return parent;
        },
        clear: function (element) {
          while (element.firstChild) {
            element.removeChild(element.firstChild);
          }
          return element;
        },
      };

      const MOLECULES = {
        createButton: function (text, classes, dataAction) {
          const attrs = { class: classes };
          if (dataAction) {
            attrs["data-action"] = dataAction;
          }
          return ATOMS.create("button", attrs, text);
        },
        createFoodItem: function (food, category, index) {
          const attrs = {
            class: "list-item rounded-sm transition-colors hover-bg",
            "data-category": category,
            "data-index": String(index),
          };
          return ATOMS.create("div", attrs, food);
        },
        createStudentListItem: function (student) {
          return ATOMS.create(
            "div",
            { class: "list-item rounded-sm transition-colors hover-bg" },
            student.order + ". " + student.name
          );
        },
      };

      const MODELS = {
        studentListModel: function (students, onSelect) {
          const fragment = document.createDocumentFragment();
          students.forEach(function (student) {
            const item = MOLECULES.createStudentListItem(student);
            item.addEventListener("click", function () {
              onSelect(student);
            });
            fragment.appendChild(item);
          });
          return fragment;
        },
        studentDetailModel: function (student, onAdd, onFoodSelect) {
          const fragment = document.createDocumentFragment();
          const likeSection = ATOMS.create("div", { class: "m-b-1" }, []);
          const likeHeader = ATOMS.create(
            "div",
            { class: "flex justify-between", style: "align-items: center;" },
            []
          );
          const likeTitle = ATOMS.create("h3", null, "좋아하는 음식");
          const addLikeBtn = MOLECULES.createButton(
            "+ 추가하기",
            "btn btn-primary",
            SELECTORS.addLike
          );
          likeHeader.appendChild(likeTitle);
          likeHeader.appendChild(addLikeBtn);
          likeSection.appendChild(likeHeader);
          const likeList = ATOMS.create("div", { class: "like-list" }, []);
          student.food.like.forEach(function (food, index) {
            const foodItem = MOLECULES.createFoodItem(food, "like", index);
            foodItem.addEventListener("click", function () {
              onFoodSelect("like", index);
            });
            likeList.appendChild(foodItem);
          });
          likeSection.appendChild(likeList);
          const hateSection = ATOMS.create("div", null, []);
          const hateHeader = ATOMS.create(
            "div",
            { class: "flex justify-between", style: "align-items: center;" },
            []
          );
          const hateTitle = ATOMS.create("h3", null, "싫어하는 음식");
          const addHateBtn = MOLECULES.createButton(
            "+ 추가하기",
            "btn btn-primary",
            SELECTORS.addHate
          );
          hateHeader.appendChild(hateTitle);
          hateHeader.appendChild(addHateBtn);
          hateSection.appendChild(hateHeader);
          const hateList = ATOMS.create("div", { class: "hate-list" }, []);
          student.food.hate.forEach(function (food, index) {
            const foodItem = MOLECULES.createFoodItem(food, "hate", index);
            foodItem.addEventListener("click", function () {
              onFoodSelect("hate", index);
            });
            hateList.appendChild(foodItem);
          });
          hateSection.appendChild(hateList);
          ATOMS.appendAll(fragment, [likeSection, hateSection]);
          addLikeBtn.addEventListener("click", function () {
            onAdd("like");
          });
          addHateBtn.addEventListener("click", function () {
            onAdd("hate");
          });
          return fragment;
        },
        modalContentModel: function (mode, currentValue) {
          const fragment = document.createDocumentFragment();
          if (mode === "edit") {
            const title = ATOMS.create("h2", { class: "text-xl font-semibold m-b-1" }, "수정하기");
            const inputField = ATOMS.create(
              "input",
              {
                type: "text",
                id: SELECTORS.foodInput,
                class: "input-field m-b-1",
                placeholder: "음식 이름 입력",
              },
              ""
            );
            inputField.value = currentValue;
            const btnContainer = ATOMS.create(
              "div",
              { class: "flex gap-2", style: "margin-top: var(--spacing-1);" },
              []
            );
            const confirmBtn = MOLECULES.createButton(
              "수정하기",
              "btn btn-primary",
              SELECTORS.confirm
            );
            const deleteBtn = MOLECULES.createButton(
              "삭제하기",
              "btn btn-secondary",
              SELECTORS.delete
            );
            const cancelBtn = MOLECULES.createButton("취소", "btn btn-secondary", SELECTORS.cancel);
            ATOMS.appendAll(btnContainer, [confirmBtn, deleteBtn, cancelBtn]);
            ATOMS.appendAll(fragment, [title, inputField, btnContainer]);
          } else if (mode === "add") {
            const title = ATOMS.create("h2", { class: "text-xl font-semibold m-b-1" }, "추가하기");
            const inputField = ATOMS.create(
              "input",
              {
                type: "text",
                id: SELECTORS.foodInput,
                class: "input-field m-b-1",
                placeholder: "음식 이름 입력",
              },
              ""
            );
            const btnContainer = ATOMS.create(
              "div",
              { class: "flex gap-2", style: "margin-top: var(--spacing-1);" },
              []
            );
            const confirmBtn = MOLECULES.createButton(
              "추가하기",
              "btn btn-primary",
              SELECTORS.confirm
            );
            const cancelBtn = MOLECULES.createButton("취소", "btn btn-secondary", SELECTORS.cancel);
            ATOMS.appendAll(btnContainer, [confirmBtn, cancelBtn]);
            ATOMS.appendAll(fragment, [title, inputField, btnContainer]);
          }
          return fragment;
        },
        modifiedListModel: function (modifiedStudents) {
          const fragment = document.createDocumentFragment();
          Object.keys(modifiedStudents).forEach(function (key) {
            const student = modifiedStudents[key];
            const item = ATOMS.create("div", { class: "modified-item" }, []);
            const title = ATOMS.create("strong", null, student.order + ". " + student.name);
            const likeInfo = ATOMS.create(
              "div",
              null,
              "수정된 좋아하는 음식: " + (student.food.like.join(", ") || "없음")
            );
            const hateInfo = ATOMS.create(
              "div",
              null,
              "수정된 싫어하는 음식: " + (student.food.hate.join(", ") || "없음")
            );
            ATOMS.appendAll(item, [title, likeInfo, hateInfo]);
            fragment.appendChild(item);
          });
          return fragment;
        },
      };

      const ELEMENTS = {
        root: document.getElementById("root"),
        itemList: document.querySelector(".item-list"),
        studentDetail: document.querySelector(".student-detail"),
        modifiedList: document.querySelector(".modified-list"),
        jsonButtonContainer: document.querySelector(".json-button-container"),
        modalOverlay: document.querySelector(".modal-overlay"),
        modal: null,
      };

      const STATE = {
        selectedStudent: null,
        modified: {},
        modalMode: null,
        modalCategory: null,
        modalIndex: null,
      };

      const ORGANISMS = {
        renderStudentList: function () {
          ATOMS.clear(ELEMENTS.itemList);
          ELEMENTS.itemList.appendChild(
            MODELS.studentListModel(STUDENTS, function (student) {
              STATE.selectedStudent = student;
              ORGANISMS.renderStudentDetail(student);
            })
          );
        },
        renderStudentDetail: function (student) {
          ATOMS.clear(ELEMENTS.studentDetail);
          ELEMENTS.studentDetail.appendChild(
            MODELS.studentDetailModel(
              student,
              function (category) {
                STATE.modalMode = "add";
                STATE.modalCategory = category;
                STATE.modalIndex = null;
                CONTROLLERS.openModal();
              },
              function (category, index) {
                STATE.modalMode = "edit";
                STATE.modalCategory = category;
                STATE.modalIndex = index;
                CONTROLLERS.openModal();
              }
            )
          );
        },
        renderModifiedList: function () {
          ATOMS.clear(ELEMENTS.modifiedList);
          ELEMENTS.modifiedList.appendChild(MODELS.modifiedListModel(STATE.modified));
          ATOMS.clear(ELEMENTS.jsonButtonContainer);
          if (Object.keys(STATE.modified).length > 0) {
            const jsonBtn = MOLECULES.createButton("JSON 저장하기", "btn btn-primary", null);
            jsonBtn.addEventListener("click", function () {
              CONTROLLERS.downloadJSON();
            });
            ELEMENTS.jsonButtonContainer.appendChild(jsonBtn);
          }
        },
        renderModal: function (contentFragment) {
          ATOMS.clear(ELEMENTS.modalOverlay);
          ELEMENTS.modalOverlay.appendChild(contentFragment);
          ELEMENTS.modalOverlay.classList.add("active");
        },
      };

      const CONTROLLERS = {
        openModal: function () {
          ATOMS.clear(ELEMENTS.modalOverlay);
          const modalContent = ATOMS.create("div", { class: "modal-content" }, []);
          ELEMENTS.modalOverlay.appendChild(modalContent);
          ELEMENTS.modal = modalContent;
          ELEMENTS.modalOverlay.addEventListener("click", CONTROLLERS.closeModal);
          ELEMENTS.modal.addEventListener("click", function (event) {
            event.stopPropagation();
          });
          const mode = STATE.modalMode;
          let currentValue = "";
          if (mode === "edit") {
            currentValue = STATE.selectedStudent.food[STATE.modalCategory][STATE.modalIndex];
          }
          const contentFragment = MODELS.modalContentModel(mode, currentValue);
          ATOMS.clear(ELEMENTS.modal);
          ELEMENTS.modal.appendChild(contentFragment);
          ELEMENTS.modalOverlay.classList.add("active");
          const inputElement = document.getElementById(SELECTORS.foodInput);
          inputElement.focus();
          const handlers = [
            {
              selector: '[data-action="' + SELECTORS.confirm + '"]',
              event: "click",
              handler: CONTROLLERS.handleConfirm,
            },
            {
              selector: '[data-action="' + SELECTORS.delete + '"]',
              event: "click",
              handler: CONTROLLERS.handleDelete,
            },
            {
              selector: '[data-action="' + SELECTORS.cancel + '"]',
              event: "click",
              handler: CONTROLLERS.closeModal,
            },
            {
              selector: "#" + SELECTORS.foodInput,
              event: "keydown",
              handler: function (event) {
                if (event.key === "Enter") {
                  CONTROLLERS.handleConfirm();
                }
              },
            },
          ];
          handlers.forEach(function (config) {
            const el = ELEMENTS.modal.querySelector(config.selector);
            if (el) {
              el.addEventListener(config.event, config.handler);
            }
          });
        },
        closeModal: function () {
          ELEMENTS.modalOverlay.classList.remove("active");
          ATOMS.clear(ELEMENTS.modal);
        },
        handleConfirm: function () {
          const inputElement = document.getElementById(SELECTORS.foodInput);
          const inputValue = inputElement.value.trim();
          if (inputValue === "") {
            alert("음식 이름을 입력해주세요.");
            return;
          }
          if (STATE.modalMode === "edit") {
            STATE.selectedStudent.food[STATE.modalCategory][STATE.modalIndex] = inputValue;
          } else if (STATE.modalMode === "add") {
            STATE.selectedStudent.food[STATE.modalCategory].push(inputValue);
          }
          STATE.modified[STATE.selectedStudent.order] = STATE.selectedStudent;
          ORGANISMS.renderStudentDetail(STATE.selectedStudent);
          ORGANISMS.renderModifiedList();
          CONTROLLERS.closeModal();
        },
        handleDelete: function () {
          STATE.selectedStudent.food[STATE.modalCategory].splice(STATE.modalIndex, 1);
          STATE.modified[STATE.selectedStudent.order] = STATE.selectedStudent;
          ORGANISMS.renderStudentDetail(STATE.selectedStudent);
          ORGANISMS.renderModifiedList();
          CONTROLLERS.closeModal();
        },
        downloadJSON: function () {
          const jsonData = JSON.stringify(Object.values(STATE.modified), null, 2);
          const dataBlob = new Blob([jsonData], {
            type: "application/json",
          });
          const blobUrl = URL.createObjectURL(dataBlob);
          const downloadLink = ATOMS.create(
            "a",
            { href: blobUrl, download: "modified_students.json" },
            ""
          );
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);
          URL.revokeObjectURL(blobUrl);
        },
      };

      const STUDENTS = [
        { order: 1, name: "김민지", food: { like: ["짜장면", "짬뽕"], hate: ["피자"] } },
        { order: 2, name: "김요훈", food: { like: ["햄버거", "초밥"], hate: ["라면"] } },
        { order: 3, name: "김윤지", food: { like: ["피자", "라면"], hate: ["떡볶이"] } },
        { order: 4, name: "김재승", food: { like: ["초밥", "떡볶이"], hate: ["짜장면"] } },
        { order: 5, name: "손정민", food: { like: ["짜장면", "파스타"], hate: ["짬뽕"] } },
        { order: 6, name: "안은별", food: { like: ["짬뽕", "김밥"], hate: ["초밥"] } },
        { order: 7, name: "윤종환", food: { like: ["피자", "치킨"], hate: ["햄버거"] } },
        { order: 8, name: "최정민", food: { like: ["햄버거", "라면"], hate: ["파스타"] } },
        { order: 9, name: "최현준", food: { like: ["짜장면", "떡볶이"], hate: ["김밥"] } },
        { order: 10, name: "전선일", food: { like: ["초밥", "파스타"], hate: ["피자"] } },
      ];

      const main = function () {
        ORGANISMS.renderStudentList();
      };

      main();
    </script>
  </body>
</html>
